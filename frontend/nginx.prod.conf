server {
    listen 80;
    server_name syslabo.duckdns.org 46.137.199.219 localhost;

    # Redirect domain HTTP traffic to HTTPS
    if ($host = syslabo.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy pass
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    server_name syslabo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/syslabo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syslabo.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
